name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to Production Host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_VM_HOST }}
          username: ${{ secrets.OCI_VM_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_SSH_PORT || 22 }}
          script: |
            set -e

            # 0. Ensure standard PATH and load NVM if present
            export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            if [ -d "$HOME/.nvm/versions/node" ]; then
              NODE_NVM_BIN="$(find "$HOME/.nvm/versions/node" -maxdepth 2 -name bin 2>/dev/null | tail -n 1)"
              [ -n "$NODE_NVM_BIN" ] && export PATH="$NODE_NVM_BIN:$PATH"
            fi

            echo "Using Node: $(which node || echo 'not found') ($(node -v 2>/dev/null || echo 'N/A'))"
            echo "Using NPM: $(which npm || echo 'not found') ($(npm -v 2>/dev/null || echo 'N/A'))"

            echo "=== 1. Syncing latest code ==="
            cd /home/basbuddy/basbuddy
            git fetch origin main
            git reset --hard origin/main

            echo "=== 2. Installing dependencies & building ==="
            npm ci
            npm run build

            echo "=== 3. Running database migrations ==="
            set -a
            [ -f /etc/basbuddy/.env ] && . /etc/basbuddy/.env
            set +a
            npm run migrate

            echo "=== 3.1 Cleaning up legacy favorites (one-time safe cleanup) ==="
            node --input-type=module -e "
              import pg from 'pg';
              const { Pool } = pg;
              const pool = new Pool({
                connectionString: process.env.DATABASE_URL || \`postgresql://\${process.env.POSTGRES_USER || 'basbuddy'}:\${encodeURIComponent(process.env.POSTGRES_PASSWORD || '')}@\${process.env.POSTGRES_HOST || '127.0.0.1'}:\${process.env.POSTGRES_PORT || 5432}/\${process.env.POSTGRES_DB || 'basbuddy'}\`,
              });
              try {
                const res = await pool.query(\"DELETE FROM favorites WHERE device_id = 'legacy'\");
                console.log(\`[deploy] Purged \${res.rowCount ?? 0} legacy test favorite rows.\`);
              } catch (err) {
                console.warn('[deploy] Legacy favorites cleanup note:', err.message);
              } finally {
                await pool.end();
              }
            " || true

            echo "=== 4. Syncing systemd service files ==="
            sudo cp deploy/basbuddy-api.service /etc/systemd/system/basbuddy-api.service
            sudo cp deploy/basbuddy-poller.service /etc/systemd/system/basbuddy-poller.service
            sudo cp deploy/basbuddy-ingest.service /etc/systemd/system/basbuddy-ingest.service
            sudo cp deploy/basbuddy-ingest.timer /etc/systemd/system/basbuddy-ingest.timer

            sudo systemctl daemon-reload

            echo "=== 5. Restarting services & timers ==="
            sudo systemctl restart basbuddy-api
            sudo systemctl restart basbuddy-poller
            sudo systemctl enable --now basbuddy-ingest.timer
            sudo systemctl start basbuddy-ingest.service || true

            echo "=== 6. Reloading Caddy ==="
            sudo systemctl reload caddy

            echo "=== 7. Performing local health check ==="
            sleep 2
            curl -fsS http://127.0.0.1:3001/api/routes > /dev/null
            echo "✓ Deployment completed successfully."
